name: axion-distributed

x-shard: &shard
  image: axion-server:local
  build:
    context: ..
    dockerfile: Dockerfile
  environment:
    AXION_HOST: 0.0.0.0
    AXION_HTTP_PORT: 8080
    AXION_GRPC_PORT: 50051
    AXION_API_KEY: local-shard-key
    AXION_CORS_ALLOW_ANY: "false"
    RUST_LOG: axion=info,tower_http=info
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
    interval: 3s
    timeout: 2s
    retries: 20
    start_period: 10s
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: 2G
      reservations:
        memory: 256M

services:
  shard-a:
    <<: *shard
    environment:
      AXION_HOST: 0.0.0.0
      AXION_HTTP_PORT: 8080
      AXION_GRPC_PORT: 50051
      AXION_DATA_DIR: /var/lib/axion
      AXION_API_KEY: local-shard-key
      AXION_CORS_ALLOW_ANY: "false"
      RUST_LOG: axion=info,tower_http=info
    ports:
      - "${AXION_SHARD_A_PORT:-18091}:8080"
    volumes:
      - shard-a-data:/var/lib/axion

  shard-b:
    <<: *shard
    environment:
      AXION_HOST: 0.0.0.0
      AXION_HTTP_PORT: 8080
      AXION_GRPC_PORT: 50051
      AXION_DATA_DIR: /var/lib/axion
      AXION_API_KEY: local-shard-key
      AXION_CORS_ALLOW_ANY: "false"
      RUST_LOG: axion=info,tower_http=info
    ports:
      - "${AXION_SHARD_B_PORT:-18092}:8080"
    volumes:
      - shard-b-data:/var/lib/axion

  coordinator:
    image: axion-server:local
    entrypoint: ["/usr/local/bin/axion-cluster"]
    environment:
      AXION_CLUSTER_HOST: 0.0.0.0
      AXION_CLUSTER_PORT: 8090
      AXION_SHARD_NODES: shard-a=http://shard-a:8080,shard-b=http://shard-b:8080
      AXION_MIN_SEARCH_SHARDS: 1
      AXION_CLUSTER_API_KEY: local-coordinator-key
      AXION_SHARD_API_KEY: local-shard-key
      AXION_SHARD_TIMEOUT_MS: 3000
      RUST_LOG: axion_cluster=info,tower_http=info
    ports:
      - "${AXION_COORDINATOR_PORT:-18090}:8090"
    depends_on:
      shard-a:
        condition: service_healthy
      shard-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8090/health/ready"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 64M

volumes:
  shard-a-data:
  shard-b-data:
