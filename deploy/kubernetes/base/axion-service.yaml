apiVersion: v1
kind: Service
metadata:
  name: axion
  namespace: axion
  labels:
    app.kubernetes.io/name: axion
    app.kubernetes.io/component: engine
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: axion
    app.kubernetes.io/component: engine
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP

