name: axion

services:
  axion:
    image: axion-server:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      AXION_HOST: 0.0.0.0
      AXION_HTTP_PORT: 8080
      AXION_GRPC_PORT: 50051
      AXION_DATA_DIR: /var/lib/axion
      AXION_API_KEY: ${AXION_API_KEY:-}
      AXION_CORS_ALLOW_ANY: "false"
      RUST_LOG: ${RUST_LOG:-axion=info,tower_http=info}
    ports:
      - "${AXION_HTTP_PORT:-8080}:8080"
      - "${AXION_GRPC_PORT:-50051}:50051"
    volumes:
      - axion-data:/var/lib/axion
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          memory: 256M

  web:
    image: axion-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        AXION_API_URL: http://axion:8080
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${AXION_WEB_PORT:-3000}:3000"
    depends_on:
      axion:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  prometheus:
    image: prom/prometheus:v3.8.0
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./deploy/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      axion:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  axion-data:
    name: ${AXION_DATA_VOLUME:-axion-data}
  prometheus-data:
    name: ${AXION_PROMETHEUS_VOLUME:-axion-prometheus-data}

