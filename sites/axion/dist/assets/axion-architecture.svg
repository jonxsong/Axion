<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Axion architecture</title>
  <desc id="desc">Clients enter through REST or gRPC APIs, the query engine evaluates filters and searches exact or HNSW indexes, and RocksDB stores durable records. An optional coordinator partitions writes and fans searches across independent shards. Telemetry leaves through logs, Prometheus, and OpenTelemetry.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b0e"/><stop offset="1" stop-color="#12181c"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6ee7b7"/><stop offset="1" stop-color="#22b889"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#6ee7b7"/></marker>
    <style>
      .title{font:700 34px Inter,Segoe UI,Arial,sans-serif;fill:#f2f6f5}.subtitle{font:400 16px Inter,Segoe UI,Arial,sans-serif;fill:#8fa09c}.label{font:700 17px Inter,Segoe UI,Arial,sans-serif;fill:#edf3f1}.small{font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#91a19e}.eyebrow{font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#6ee7b7;letter-spacing:2px}.box{fill:#141b1f;stroke:#2b3a3a;stroke-width:1.5}.core{fill:#18231f;stroke:#559b82;stroke-width:1.5}.line{fill:none;stroke:#6ee7b7;stroke-width:2;marker-end:url(#arrow)}.muted{fill:none;stroke:#51615f;stroke-width:1.5;stroke-dasharray:6 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="820" rx="28" fill="url(#bg)"/>
  <circle cx="1260" cy="74" r="7" fill="#6ee7b7"/><circle cx="1290" cy="74" r="7" fill="#385149"/><circle cx="1320" cy="74" r="7" fill="#24332f"/>
  <text x="70" y="78" class="eyebrow">SYSTEM MAP / v0.1</text>
  <text x="70" y="120" class="title">A short, durable path from vector to answer.</text>
  <text x="70" y="151" class="subtitle">RocksDB is authoritative. HNSW is reconstructed derived state. Every boundary is independently testable.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="215" width="220" height="390" rx="18" class="box"/>
    <text x="96" y="250" class="eyebrow">CLIENTS</text>
    <rect x="95" y="275" width="170" height="56" rx="11" class="box"/><text x="116" y="309" class="label">Web console</text>
    <rect x="95" y="348" width="170" height="56" rx="11" class="box"/><text x="116" y="382" class="label">Python SDK</text>
    <rect x="95" y="421" width="170" height="56" rx="11" class="box"/><text x="116" y="455" class="label">REST clients</text>
    <rect x="95" y="494" width="170" height="56" rx="11" class="box"/><text x="116" y="528" class="label">gRPC clients</text>

    <rect x="350" y="215" width="670" height="500" rx="20" fill="#0f1518" stroke="#33423f" stroke-width="2"/>
    <text x="380" y="250" class="eyebrow">AXION SERVER</text>
    <rect x="380" y="276" width="180" height="90" rx="14" class="box"/>
    <text x="405" y="310" class="label">API boundary</text><text x="405" y="337" class="small">Axum REST · Tonic gRPC</text>
    <rect x="605" y="276" width="180" height="90" rx="14" class="core"/>
    <text x="630" y="310" class="label">Query engine</text><text x="630" y="337" class="small">plan · validate · rank</text>
    <rect x="830" y="276" width="160" height="90" rx="14" class="box"/>
    <text x="855" y="310" class="label">Filters</text><text x="855" y="337" class="small">exact pre-filter</text>

    <rect x="495" y="420" width="190" height="100" rx="14" class="box"/>
    <text x="520" y="457" class="label">Exact search</text><text x="520" y="483" class="small">deterministic baseline</text>
    <rect x="730" y="420" width="190" height="100" rx="14" class="core"/>
    <text x="755" y="457" class="label">Native HNSW</text><text x="755" y="483" class="small">multilayer ANN graph</text>
    <rect x="495" y="572" width="425" height="105" rx="14" fill="#11191d" stroke="#4f786d" stroke-width="2"/>
    <text x="525" y="611" class="label">RocksDB · default durable truth</text>
    <text x="525" y="640" class="small">synchronous WAL batches · schema versioning · restart recovery</text>
  </g>

  <path d="M290 410H380" class="line"/><path d="M560 321H605" class="line"/><path d="M785 321H830" class="line"/>
  <path d="M695 366V394H590V420" class="line"/><path d="M695 366V394H825V420" class="line"/>
  <path d="M590 520V572" class="line"/><path d="M825 520V572" class="line"/>

  <g filter="url(#shadow)">
    <rect x="1080" y="215" width="250" height="230" rx="18" class="box"/>
    <text x="1107" y="250" class="eyebrow">OPTIONAL SCALE-OUT</text>
    <rect x="1106" y="276" width="198" height="65" rx="12" class="core"/>
    <text x="1130" y="305" class="label">Coordinator</text><text x="1130" y="327" class="small">stable hash · fan-out · merge</text>
    <rect x="1106" y="365" width="90" height="52" rx="10" class="box"/><text x="1126" y="397" class="label">Shard A</text>
    <rect x="1214" y="365" width="90" height="52" rx="10" class="box"/><text x="1234" y="397" class="label">Shard B</text>
  </g>
  <path d="M1205 341V354H1151V365" class="line"/><path d="M1205 341V354H1259V365" class="line"/>
  <path d="M1080 308H1020" class="muted"/>

  <g filter="url(#shadow)">
    <rect x="1080" y="490" width="250" height="225" rx="18" class="box"/>
    <text x="1107" y="525" class="eyebrow">OPERATIONS</text>
    <text x="1107" y="566" class="label">Structured JSON logs</text>
    <text x="1107" y="607" class="label">Prometheus metrics</text>
    <text x="1107" y="648" class="label">OTLP traces</text>
    <text x="1107" y="685" class="small">request IDs · bounded labels</text>
  </g>
  <path d="M1020 610H1080" class="muted"/>
  <text x="70" y="770" class="small">Single-node and distributed paths use the same search engine and RocksDB durability contract.</text>
</svg>
