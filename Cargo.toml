[workspace]
members = [
    "crates/axion-api",
    "crates/axion-core",
    "crates/axion-grpc",
    "crates/axion-index",
    "crates/axion-query",
    "crates/axion-storage",
    "crates/axion-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jonxsong/Axion"
rust-version = "1.89"

[workspace.dependencies]
axion-api = { path = "crates/axion-api" }
axion-core = { path = "crates/axion-core" }
axion-grpc = { path = "crates/axion-grpc" }
axion-index = { path = "crates/axion-index" }
axion-query = { path = "crates/axion-query" }
axion-storage = { path = "crates/axion-storage" }
axum = { version = "0.8", features = ["macros"] }
criterion = { version = "0.7", features = ["html_reports"] }
http = "1.3"
http-body-util = "0.1"
prometheus = "0.14"
prost = "0.13"
proptest = "1.8"
rand = "0.9"
rand_chacha = { version = "0.9", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
thiserror = "2.0"
tempfile = "3.27"
tokio = { version = "1.48", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.12", features = ["transport"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "limit", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

